apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: store-demo
  labels:
    app.kubernetes.io/part-of: kube-agent-benchmarks
spec:
  replicas: 1
  serviceName: store-demo
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: store-demo
  template:
    metadata:
      labels:
        app: store-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "-c"]
          args:
            - |
              import os
              from http.server import BaseHTTPRequestHandler, HTTPServer

              DATA_DIR = "/data"
              COUNT_FILE = os.path.join(DATA_DIR, "boot-count")
              PROBE_FILE = os.path.join(DATA_DIR, ".write-check")

              def write_file(path, text):
                  tmp = path + ".tmp"
                  with open(tmp, "w") as f:
                      f.write(text)
                      f.flush()
                      os.fsync(f.fileno())
                  os.replace(tmp, path)

              try:
                  with open(COUNT_FILE) as f:
                      boot_count = int(f.read().strip()) + 1
              except FileNotFoundError:
                  boot_count = 1
              write_file(COUNT_FILE, str(boot_count))
              print(f"Boot {boot_count}; data directory {DATA_DIR} is writable", flush=True)

              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path != "/":
                          self.send_error(404)
                          return
                      try:
                          write_file(PROBE_FILE, "ok")
                      except OSError as e:
                          print(f"Data directory check failed: {e}", flush=True)
                          self.send_error(503, "data directory not writable")
                          return
                      body = b"healthy\n"
                      self.send_response(200)
                      self.send_header("Content-Type", "text/plain")
                      self.send_header("Content-Length", str(len(body)))
                      self.send_header("X-Boot-Count", str(boot_count))
                      self.end_headers()
                      self.wfile.write(body)

              print("Starting HTTP server on port 8080", flush=True)
              HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: store-demo-data
