apiVersion: apps/v1
kind: Deployment
metadata:
  name: crash-demo
  labels:
    app.kubernetes.io/part-of: kube-agent-benchmarks
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: crash-demo
  template:
    metadata:
      labels:
        app: crash-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "-c"]
          args:
            - |
              import os
              import sys
              from http.server import BaseHTTPRequestHandler, HTTPServer

              mode = os.environ.get("APP_MODE", "")
              if mode != "production":
                  print(
                      f"FATAL: invalid APP_MODE={mode!r}; expected 'production'",
                      flush=True,
                  )
                  sys.exit(1)

              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      body = b"healthy\n"
                      self.send_response(200)
                      self.send_header("Content-Type", "text/plain")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)

              print("Starting HTTP server on port 8080", flush=True)
              HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          env:
            - name: APP_MODE
              value: invalid
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
