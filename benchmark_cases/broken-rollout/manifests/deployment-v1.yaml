apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollout-demo
  labels:
    app.kubernetes.io/part-of: kube-agent-benchmarks
  annotations:
    kubernetes.io/change-cause: "Release 1.0.0"
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: rollout-demo
  template:
    metadata:
      labels:
        app: rollout-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "-c"]
          args:
            - |
              import os
              from http.server import BaseHTTPRequestHandler, HTTPServer

              VERSION = os.environ["APP_VERSION"]

              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path != "/":
                          self.send_error(404)
                          return
                      body = b"healthy\n"
                      self.send_response(200)
                      self.send_header("Content-Type", "text/plain")
                      self.send_header("Content-Length", str(len(body)))
                      self.send_header("X-App-Version", VERSION)
                      self.end_headers()
                      self.wfile.write(body)

              print(f"Starting HTTP server version {VERSION} on port 8080", flush=True)
              HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          env:
            - name: APP_VERSION
              value: "1.0.0"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
