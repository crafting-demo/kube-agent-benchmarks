apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-quota
  labels:
    app.kubernetes.io/part-of: kube-agent-benchmarks
  annotations:
    kube-agent-benchmarks/description: "Namespace resource budget set by the platform team. Changes require a platform-team request."
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.memory: 2Gi
